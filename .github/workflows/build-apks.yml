name: Build Z-Solution APKs
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build all apps
        run: gradle --no-daemon :parent:assembleDebug :admin:assembleDebug :teacher:assembleDebug
      - name: Collect APKs
        run: |
          mkdir -p apks
          cp parent/build/outputs/apk/debug/parent-debug.apk apks/Z-Solution-Parent.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk apks/Z-Solution-Admin.apk
          cp teacher/build/outputs/apk/debug/teacher-debug.apk apks/Z-Solution-Teacher.apk
          ls -lh apks
      - uses: actions/upload-artifact@v4
        with:
          name: Z-Solution-3-Android-APKs
          path: apks/*.apk
          retention-days: 30
